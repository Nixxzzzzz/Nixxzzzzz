<svg viewBox="0 0 880 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f26"/>
      <stop offset="100%" stop-color="#0a0815"/>
    </linearGradient>

    <linearGradient id="pink-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes synDash {
        to { stroke-dashoffset: -80; }
      }
      @keyframes nodePulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.2); opacity: 1; filter: drop-shadow(0 0 6px #f472b6); }
      }
      .anim-dash {
        stroke-dasharray: 4, 6;
        animation: synDash 2.5s linear infinite;
      }
      .node-pink { animation: nodePulse 3s ease-in-out infinite; transform-origin: 32px 32px; }
      .node-cyan { animation: nodePulse 3s ease-in-out 1.5s infinite; transform-origin: 472px 32px; }
    </style>
  </defs>

  <!-- ==================== TILE 1: ELECTRONICS & EMBEDDED ==================== -->
  <g transform="translate(0, 0)">
    <rect x="2" y="2" width="430" height="226" rx="14" fill="url(#tile-bg)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Title -->
    <circle cx="32" cy="32" r="5" fill="#f472b6" class="node-pink"/>
    <text x="48" y="37" font-family="'Orbitron', 'Inter', monospace" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1">
      ⚡ ELECTRONICS &amp; EMBEDDED SYSTEMS
    </text>

    <text x="32" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">
      Bridging physical circuits and digital intelligence:
    </text>

    <!-- Key Bullet Points -->
    <g transform="translate(32, 90)">
      <!-- Item 1 -->
      <circle cx="4" cy="4" r="2.5" fill="#c084fc"/>
      <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Microcontroller Programming &amp; Sensor Logic</text>

      <!-- Item 2 -->
      <circle cx="4" cy="28" r="2.5" fill="#f472b6"/>
      <text x="14" y="32" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Fleet Telematics &amp; Hardware Dispatch Protocols</text>

      <!-- Item 3 -->
      <circle cx="4" cy="52" r="2.5" fill="#38bdf8"/>
      <text x="14" y="56" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Digital Electronics &amp; Real-Time Data Streaming</text>
    </g>

    <!-- Tag Pills -->
    <g transform="translate(30, 182)">
      <rect x="0" y="0" width="80" height="24" rx="6" fill="#20133a" stroke="#ec4899" stroke-width="0.8"/>
      <text x="40" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fbcfe8">Embedded</text>

      <rect x="90" y="0" width="70" height="24" rx="6" fill="#20133a" stroke="#a855f7" stroke-width="0.8"/>
      <text x="125" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#e9d5ff">Circuits</text>

      <rect x="170" y="0" width="95" height="24" rx="6" fill="#20133a" stroke="#06b6d4" stroke-width="0.8"/>
      <text x="217" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a5f3fc">Telematics</text>

      <rect x="275" y="0" width="60" height="24" rx="6" fill="#20133a" stroke="#f43f5e" stroke-width="0.8"/>
      <text x="305" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fda4af">IoT</text>
    </g>
  </g>

  <!-- ==================== TILE 2: COMPUTER SCIENCE & SOFTWARE ==================== -->
  <g transform="translate(450, 0)">
    <rect x="0" y="2" width="430" height="226" rx="14" fill="url(#tile-bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Title -->
    <circle cx="32" cy="32" r="5" fill="#38bdf8" class="node-cyan"/>
    <text x="48" y="37" font-family="'Orbitron', 'Inter', monospace" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">
      🌐 COMPUTER SCIENCE &amp; SOFTWARE
    </text>

    <text x="32" y="70" font-family="'Inter', sans-serif" font-size="12" fill="#cbd5e1">
      Architecting scalable code, APIs, and modern platforms:
    </text>

    <!-- Key Bullet Points -->
    <g transform="translate(32, 90)">
      <!-- Item 1 -->
      <circle cx="4" cy="4" r="2.5" fill="#38bdf8"/>
      <text x="14" y="8" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Full-Stack Web Development &amp; Modern UI/UX</text>

      <!-- Item 2 -->
      <circle cx="4" cy="28" r="2.5" fill="#c084fc"/>
      <text x="14" y="32" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Python Data Automation &amp; Scripting Pipelines</text>

      <!-- Item 3 -->
      <circle cx="4" cy="52" r="2.5" fill="#f472b6"/>
      <text x="14" y="56" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">TypeScript Applications &amp; Clean Architecture</text>
    </g>

    <!-- Tag Pills -->
    <g transform="translate(30, 182)">
      <rect x="0" y="0" width="70" height="24" rx="6" fill="#131e3a" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="35" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#bae6fd">Python</text>

      <rect x="80" y="0" width="90" height="24" rx="6" fill="#131e3a" stroke="#3b82f6" stroke-width="0.8"/>
      <text x="125" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#bfdbfe">TypeScript</text>

      <rect x="180" y="0" width="90" height="24" rx="6" fill="#131e3a" stroke="#a855f7" stroke-width="0.8"/>
      <text x="225" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#e9d5ff">JavaScript</text>

      <rect x="280" y="0" width="60" height="24" rx="6" fill="#131e3a" stroke="#10b981" stroke-width="0.8"/>
      <text x="310" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#a7f3d0">HTML5</text>
    </g>
  </g>
</svg>
