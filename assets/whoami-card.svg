<svg viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sonia Whoami Terminal">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140f26"/>
      <stop offset="100%" stop-color="#0b0817"/>
    </linearGradient>

    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="720" height="350" rx="14"/>
    </clipPath>

    <style>
      @keyframes beamMove {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(750px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes cardGlow {
        0%, 100% { stroke-opacity: 0.35; filter: drop-shadow(0 0 8px rgba(244,114,182,0.3)); }
        50% { stroke-opacity: 0.8; filter: drop-shadow(0 0 16px rgba(192,132,252,0.6)); }
      }
      .beam { animation: beamMove 5s ease-in-out infinite; }
      .cursor { animation: blinkCursor 0.9s steps(1) infinite; }
      .border-pulse { animation: cardGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Window -->
    <rect width="720" height="350" fill="url(#term-bg)"/>

    <!-- Light Sweep Beam -->
    <rect class="beam" width="160" height="350" fill="url(#beamGrad)"/>

    <!-- Title Bar -->
    <rect width="720" height="42" fill="#1b1433" opacity="0.9"/>
    <circle cx="24" cy="21" r="5.5" fill="#f43f5e"/>
    <circle cx="42" cy="21" r="5.5" fill="#fbbf24"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
    
    <text x="360" y="26" text-anchor="middle" font-family="'JetBrains Mono', 'Segoe UI Mono', monospace" font-size="12" font-weight="600" fill="#e9d5ff" opacity="0.8">
      sonia@aurora-station:~ (ece-cse-core)
    </text>
    <line x1="0" y1="42" x2="720" y2="42" stroke="#a855f7" stroke-opacity="0.3"/>

    <!-- Terminal Text Content -->
    <!-- Prompt Line -->
    <text x="32" y="74" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13.5" fill="#a78bfa">
      &gt; system.load_identity("Sonia") <tspan fill="#34d399">➔ SUCCESS [200 OK]</tspan>
    </text>
    <text x="32" y="96" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="13.5" fill="#93c5fd">
      $ cat telemetry.manifest
    </text>

    <!-- Key-Value Manifest Lines -->
    <text x="32" y="132" font-family="'JetBrains Mono', monospace" font-size="13.5" xml:space="preserve">
      <tspan x="32" dy="0"><tspan fill="#f472b6" font-weight="600">identity:   </tspan><tspan fill="#fbcfe8">Sonia</tspan> <tspan fill="#94a3b8">(@Nixxzzzzz)</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">discipline: </tspan><tspan fill="#e9d5ff">Electronics &amp; Computer Science Engineering</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">interests:  </tspan><tspan fill="#c084fc">Embedded Systems · Telematics · Web Architecture · IoT</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">stacks:     </tspan><tspan fill="#67e8f9">Python · TypeScript · JavaScript · HTML/CSS · C/C++ · SQL</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">frameworks: </tspan><tspan fill="#fde047">React · Node.js · Express · REST APIs · Git</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">motto:      </tspan><tspan fill="#fbcfe8">“Unraveling tech wonders where silicon meets intelligent code ✨”</tspan></tspan>
      <tspan x="32" dy="25"><tspan fill="#f472b6" font-weight="600">status:     </tspan><tspan fill="#34d399">Building real-world projects &amp; exploring new frontiers 🚀</tspan></tspan>
    </text>

    <!-- Active Terminal Prompt -->
    <text x="32" y="322" font-family="'JetBrains Mono', monospace" font-size="13.5" fill="#f472b6">
      sonia@aurora:~$ <tspan class="cursor" fill="#67e8f9">▌</tspan>
    </text>
  </g>

  <!-- Glowing Border -->
  <rect class="border-pulse" x="1.5" y="1.5" width="717" height="347" rx="14" fill="none" stroke="#c084fc" stroke-width="1.5"/>
</svg>
